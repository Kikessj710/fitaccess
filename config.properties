# ==============================================
#  FitAccess - configuracion (se puede cambiar
#  el dia de la exposicion SIN recompilar)
# ==============================================

# Base de datos (XAMPP: usuario root sin clave)
db.url=jdbc:mysql://localhost:3306/fitaccess?useSSL=false&serverTimezone=America/Guayaquil&allowPublicKeyRetrieval=true
db.user=root
db.password=

# Camara: 0 = primera camara. Si la laptop tiene webcam propia, DroidCam suele ser 1
camara.indice=2

# Reconocimiento: mientras MAS BAJO el numero, mas estricto (LBPH: 50-80 es normal)
reconocimiento.umbral=70
# Cuadros seguidos con la misma persona antes de aceptar
reconocimiento.cuadros=4

# Fotos que se toman al registrar a un cliente
rostros.carpeta=rostros
rostros.cantidad=20

# Minutos minimos entre dos lecturas de la misma persona (evita duplicados)
acceso.pausa.minutos=2

# Horario del gimnasio
gimnasio.hora.cierre=22:00
# Dias que abre: 1=lunes ... 7=domingo
gimnasio.dias.apertura=1,2,3,4,5,6

# Arduino: vacio = deteccion automatica. Ejemplo: COM4
arduino.puerto=COM7
